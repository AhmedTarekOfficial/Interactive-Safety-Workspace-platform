server.port=8080

# ─── MySQL Database ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/safety_workspace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=ahmed555@_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Naming strategy (map camelCase → snake_case automatically) ───────────────
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ─── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.upload.dir=./uploads

# ─── Static Resources (fixes mp4 download issue) ──────────────────────────────
spring.mvc.contentnegotiation.media-types.mp4=video/mp4
spring.mvc.contentnegotiation.media-types.webm=video/webm

openai.api.key=${OPENAI_API_KEY:}