<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title th:text="${lang == 'ar'} ? 'تسجيل الدخول — SafeGuard' : 'Login — SafeGuard'">Login - SafeGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Tajawal:wght@400;500;700;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #8b5cf6;
            --bg-light: #f0f2f5;
            --bg-dark: #0d1117;
            --card-light: rgba(255, 255, 255, 0.85);
            --card-dark: rgba(15, 25, 35, 0.8);
            --txt-light: #0f172a;
            --txt-dark: #f1f5f9;
            --sub-light: rgba(15, 23, 42, 0.55);
            --sub-dark: rgba(241, 245, 249, 0.55);
            --inp-light: #ffffff;
            --inp-dark: #0c1520;
            --bdr-light: rgba(139, 92, 246, 0.25);
            --bdr-dark: rgba(139, 92, 246, 0.18);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            position: relative;
            overflow: hidden;
            color: var(--txt-light);
            transition: color 0.3s ease;
        }

        html.dark body {
            color: var(--txt-dark);
        }

        /* ─── إعدادات الترجمة والاتجاهات (مع حماية الأيقونات) ─── */
        html[lang="ar"] body,
        html[lang="ar"] h1,
        html[lang="ar"] div,
        html[lang="ar"] p,
        html[lang="ar"] label,
        html[lang="ar"] input,
        html[lang="ar"] button,
        html[lang="ar"] span:not(.fa-solid):not(.material-symbols-outlined) {
            font-family: 'Tajawal', sans-serif !important;
        }

        .ar {
            display: none;
        }

        html[lang="ar"] .en {
            display: none;
        }

        html[lang="ar"] .ar {
            display: inline-block;
        }

        html[lang="ar"] .text-left {
            text-align: right !important;
        }

        /* ─── خلفية الفيديو المزدوج ─── */
        #video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0d1117;
        }

        #video-bg-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: translate(-50%, -50%);
            transition: opacity 0.6s ease-in-out;
        }

        #light-video {
            opacity: 1;
        }

        #dark-video {
            opacity: 0;
        }

        html.dark #light-video {
            opacity: 0;
        }

        html.dark #dark-video {
            opacity: 1;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(240, 242, 245, 0.7);
            transition: background 0.6s ease;
        }

        html.dark .video-overlay {
            background: rgba(13, 17, 23, 0.85);
        }

        /* ─── أدوات التحكم ─── */
        .top-bar {
            position: fixed; top: 30px; right: 30px; display: flex; align-items: center; gap: 15px; z-index: 100;
        }

        /* ─── THEME SWITCH (Same as Dashboard) ─── */
        .theme-switch {
            position: relative; width: 56px; height: 28px; background: rgba(139, 92, 246, 0.1); 
            border: 2px solid var(--primary); border-radius: 30px; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .theme-switch::after {
            content: ''; position: absolute; top: 3px; left: 4px; width: 18px; height: 18px;
            background: var(--primary); border-radius: 50%; transition: 0.3s;
            box-shadow: 0 0 10px var(--primary);
        }
        html.dark .theme-switch::after { left: 30px; }

        /* ─── LANG BTN (Same as Dashboard) ─── */
        .lang-btn {
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px;
            padding: 5px 15px; border-radius: 8px; background: rgba(139, 92, 246, 0.1);
            border: 2px solid var(--primary); color: var(--primary); cursor: pointer;
            transition: 0.3s; backdrop-filter: blur(10px);
        }
        .lang-btn:hover {
            background: var(--primary); color: #fff; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }
        html[lang="ar"] .lang-btn { font-family: 'Tajawal', sans-serif !important; }

        /* ─── كارت اللوجين والـ 3D والرادار ─── */
        .card-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 16px;
            perspective: 1200px;
        }

        .scan-card {
            background: var(--card-light);
            border: 1px solid var(--bdr-light);
            border-radius: 24px;
            padding: 42px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            will-change: transform;
            transition: background 0.3s, border-color 0.3s;
        }

        html.dark .scan-card {
            background: var(--card-dark);
            border-color: var(--bdr-dark);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .scan-card::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            top: 0;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px 3px rgba(139, 92, 246, 0.6);
            animation: scan 3s linear infinite alternate;
            z-index: 10;
            pointer-events: none;
            border-radius: 50%;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
                transform: translateZ(10px);
            }

            10% {
                opacity: 1;
                transform: translateZ(10px);
            }

            90% {
                opacity: 1;
                transform: translateZ(10px);
            }

            100% {
                top: 100%;
                opacity: 0;
                transform: translateZ(10px);
            }
        }

        /* ─── الأيقونة المحفورة 3D للوجو ─── */
        .logo-row {
            text-align: center;
            margin-bottom: 30px;
            transform: translateZ(20px);
        }

        .engraved-icon-box {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border-radius: 18px;
            transform: translateZ(30px);
            z-index: 2;
            transition: transform 0.3s ease;
            color: var(--primary);
            background: rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.15), 0 2px 0 rgba(255, 255, 255, 1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        html.dark .engraved-icon-box {
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8), 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .engraved-icon-box i {
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
        }

        /* تم إزالة الترجمة من اسم البراند */
        .logo-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--txt-light);
            letter-spacing: -.5px;
            transform: translateZ(15px);
        }

        html.dark .logo-title {
            color: var(--txt-dark);
        }

        .logo-sub {
            font-size: 13px;
            color: var(--sub-light);
            margin-top: 4px;
            transform: translateZ(10px);
        }

        html.dark .logo-sub {
            color: var(--sub-dark);
        }

        /* رسالة الخطأ */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #b91c1c;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 13px;
            margin-bottom: 20px;
            animation: shake .4s ease;
            transform: translateZ(15px);
        }

        html.dark .error-box {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-8px)
            }

            75% {
                transform: translateX(8px)
            }
        }

        /* الفورم */
        form {
            transform: translateZ(10px);
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--sub-light);
            margin-bottom: 7px;
        }

        html.dark .field label {
            color: var(--sub-dark);
        }

        .field input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            background: var(--inp-light);
            border: 1.5px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 14px;
            color: var(--txt-light);
            outline: none;
            transition: border-color .2s, box-shadow .2s, background 0.3s, color 0.3s;
            font-family: inherit;
        }

        html.dark .field input {
            background: var(--inp-dark);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--txt-dark);
        }

        .field input::placeholder {
            color: rgba(100, 116, 139, .5);
        }

        .field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
        }

        /* زرار الدخول */
        .btn-submit {
            width: 100%;
            height: 50px;
            margin-top: 8px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: transform .15s ease, box-shadow .15s ease;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .card-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--sub-light);
            transform: translateZ(5px);
        }

        html.dark .card-footer {
            color: var(--sub-dark);
        }
    </style>
</head>

<body>

    <div id="video-bg-container">
        <video id="light-video"
            src="/videos/light-bg.mp4"
            autoplay loop muted playsinline></video>
        <video id="dark-video" src="/videos/dark-bg.mp4"
            autoplay loop muted playsinline></video>
        <div class="video-overlay"></div>
    </div>

    <div class="top-bar">
        <div class="theme-switch" id="themeToggle" title="Toggle Theme"></div>
        <button type="button" class="lang-btn" id="langToggle">
            <span class="en">عربي</span>
            <span class="ar">EN</span>
        </button>
    </div>

    <div class="card-wrap">
        <div class="scan-card">

            <div class="logo-row">
                <div class="engraved-icon-box">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="logo-title">SafeGuard</div>
                <div class="logo-sub">
                    <span class="en">Workplace Safety Platform</span>
                    <span class="ar">منصة السلامة المهنية</span>
                </div>
            </div>

            <div th:if="${error}" class="error-box" th:text="${error}"></div>

            <form action="/login" method="POST">
                <div class="field">
                    <label>
                        <span class="en">Email</span><span class="ar">البريد الإلكتروني</span>
                    </label>
                    <input type="email" name="email" id="emailInput" required autocomplete="email"
                        placeholder="Enter your email" />
                </div>

                <div class="field">
                    <label>
                        <span class="en">Password</span><span class="ar">كلمة المرور</span>
                    </label>
                    <input type="password" name="password" id="passInput" required autocomplete="current-password"
                        placeholder="Enter your password" />
                </div>

                <input type="hidden" name="lang" id="hiddenLang" value="en" />
                <input type="hidden" name="theme" id="hiddenTheme" value="dark" />

                <button type="submit" class="btn-submit">
                    <span class="en">Sign In</span><span class="ar">تسجيل الدخول</span>
                </button>
            </form>

            <div class="card-footer">
                <span class="en">© 2026 SafeGuard. All rights reserved.</span>
                <span class="ar">© 2026 SafeGuard. جميع الحقوق محفوظة.</span>
            </div>
        </div>
    </div>

    <script>
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        const langBtn = document.getElementById('langToggle');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');
        const hiddenLang = document.getElementById('hiddenLang');
        const hiddenTheme = document.getElementById('hiddenTheme');

        // ─── تبديل الدارك مود (فوري بدون Refresh) ───
        themeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isDark = html.classList.toggle('dark');

            // تحديث الأيقونات
            document.querySelector('.dark-icon').classList.toggle('hidden', !isDark);
            document.querySelector('.dark-icon').classList.toggle('block', isDark);
            document.querySelector('.light-icon').classList.toggle('hidden', isDark);
            document.querySelector('.light-icon').classList.toggle('block', !isDark);

            // تحديث الحقل المخفي للسيرفر
            hiddenTheme.value = isDark ? 'dark' : 'light';
        });

        // ─── تبديل اللغة (فوري بدون Refresh) ───
        langBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const currentLang = html.getAttribute('lang') || 'en';
            const isNowAr = currentLang === 'en';

            // تغيير لغة واتجاه الصفحة
            html.setAttribute('lang', isNowAr ? 'ar' : 'en');
            html.setAttribute('dir', isNowAr ? 'rtl' : 'ltr');

            // تغيير الـ Placeholders
            if (isNowAr) {
                emailInput.placeholder = "أدخل بريدك الإلكتروني";
                passInput.placeholder = "أدخل كلمة المرور";
            } else {
                emailInput.placeholder = "Enter your email";
                passInput.placeholder = "Enter your password";
            }

            // تحديث الحقل المخفي للسيرفر
            hiddenLang.value = isNowAr ? 'ar' : 'en';
        });

        // ─── GSAP 3D IN-PLACE FLOAT & TILT (مسمار في مكانه باللون الأزرق) ───
        const card = document.querySelector('.scan-card');
        if (card) {
            // الطفو لفوق بمسافة 8 بيكسل ويرجع مكانه
            card.floatTween = gsap.fromTo(card,
                { y: 0 },
                { y: -8, duration: gsap.utils.random(2, 3), yoyo: true, repeat: -1, ease: "sine.inOut" }
            );

            // الميل مع الماوس
            card.addEventListener('mousemove', (e) => {
                card.floatTween.pause();
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;

                gsap.to(card, {
                    rotationX: -y / 20,
                    rotationY: x / 20,
                    z: 20,
                    scale: 1.02,
                    boxShadow: "0 25px 50px rgba(0,0,0,0.5)",
                    borderColor: "rgba(59, 130, 246, 0.8)", // لون البوردر بينور أزرق
                    duration: 0.3,
                    ease: "power1.out"
                });
            });

            // الرجوع للطبيعي واستئناف الطفو
            card.addEventListener('mouseleave', () => {
                gsap.to(card, {
                    rotationX: 0,
                    rotationY: 0,
                    z: 0,
                    scale: 1,
                    boxShadow: html.classList.contains('dark') ? "0 20px 60px rgba(0,0,0,0.5)" : "0 20px 60px rgba(0,0,0,0.12)",
                    borderColor: html.classList.contains('dark') ? "var(--bdr-dark)" : "var(--bdr-light)",
                    duration: 0.5,
                    ease: "power2.out",
                    onComplete: () => {
                        gsap.fromTo(card, { y: 0 }, { y: -8, duration: gsap.utils.random(2, 3), yoyo: true, repeat: -1, ease: "sine.inOut" });

                        // ريسيت للدارك مود بوردر
                        if (document.body.classList.contains('dark')) {
                            card.style.borderColor = "var(--bdr-dark)";
                        }
                    }
                });
            });
        }
    </script>
</body>

</html>
