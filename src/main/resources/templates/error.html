<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Error — SafeGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Tajawal:wght@400;500;700;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6", /* اللون الأزرق الاحترافي */
                        "destructive": "#ef4444", /* اللون الأحمر للأخطاء */
                        "background-light": "#f0f2f5",
                        "background-dark": "#0d1117",
                        "card-light": "rgba(255,255,255,0.85)",
                        "card-dark": "rgba(15,25,35,0.85)",
                        "txt-light": "#0f172a",
                        "txt-dark": "#f1f5f9",
                        "sub-light": "rgba(15,23,42,0.65)",
                        "sub-dark": "rgba(241,245,249,0.65)"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            position: relative;
            overflow: hidden;
            color: #0f172a;
            transition: color 0.3s ease;
        }

        html.dark body {
            color: #f1f5f9;
        }

        /* ─── إعدادات الترجمة والاتجاهات (مع حماية الأيقونات) ─── */
        html[lang="ar"] body,
        html[lang="ar"] h1,
        html[lang="ar"] p,
        html[lang="ar"] a,
        html[lang="ar"] button,
        html[lang="ar"] span:not(.fa-solid):not(.material-symbols-outlined) {
            font-family: 'Tajawal', sans-serif !important;
        }

        .ar {
            display: none;
        }

        html[lang="ar"] .en {
            display: none;
        }

        html[lang="ar"] .ar {
            display: inline-block;
        }

        /* ─── خلفية الفيديو المزدوج ─── */
        #video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0d1117;
        }

        #video-bg-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: translate(-50%, -50%);
            transition: opacity 0.6s ease-in-out;
        }

        #light-video {
            opacity: 1;
        }

        #dark-video {
            opacity: 0;
        }

        html.dark #light-video {
            opacity: 0;
        }

        html.dark #dark-video {
            opacity: 1;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(240, 242, 245, 0.7);
            transition: background 0.6s ease;
        }

        html.dark .video-overlay {
            background: rgba(13, 17, 23, 0.85);
        }

        /* ─── أدوات التحكم ─── */
        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        html[lang="ar"] .top-bar {
            right: auto;
            left: 20px;
        }

        .ctrl-btn {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            backdrop-filter: blur(8px);
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        html.dark .ctrl-btn {
            color: #f1f5f9;
            border-color: rgba(59, 130, 246, 0.18);
            background: rgba(59, 130, 246, 0.05);
        }

        .ctrl-btn:hover {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* ─── كارت الخطأ (الرادار والـ 3D) ─── */
        .card-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 16px;
            perspective: 1200px;
        }

        .scan-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            will-change: transform;
            transition: background 0.3s, border-color 0.3s;
        }

        html.dark .scan-card {
            background: rgba(15, 25, 35, 0.85);
            border-color: rgba(239, 68, 68, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .scan-card::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            top: 0;
            height: 2px;
            background: #ef4444;
            box-shadow: 0 0 15px 3px rgba(239, 68, 68, 0.6);
            animation: scan 3s linear infinite alternate;
            z-index: 10;
            pointer-events: none;
            border-radius: 50%;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
                transform: translateZ(10px);
            }

            10% {
                opacity: 1;
                transform: translateZ(10px);
            }

            90% {
                opacity: 1;
                transform: translateZ(10px);
            }

            100% {
                top: 100%;
                opacity: 0;
                transform: translateZ(10px);
            }
        }

        /* ─── أيقونة الخطأ المحفورة ─── */
        .engraved-icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border-radius: 20px;
            transform: translateZ(30px);
            z-index: 2;
            transition: transform 0.3s ease;
            color: #ef4444;
            background: rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.15), 0 2px 0 rgba(255, 255, 255, 1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        html.dark .engraved-icon-box {
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8), 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .engraved-icon-box i {
            filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.6));
        }

        /* ─── النصوص والأزرار ─── */
        .error-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            transform: translateZ(20px);
        }

        .error-msg {
            font-size: 15px;
            color: rgba(15, 23, 42, 0.65);
            margin-bottom: 30px;
            transform: translateZ(15px);
            line-height: 1.6;
        }

        html.dark .error-msg {
            color: rgba(241, 245, 249, 0.65);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transform: translateZ(25px);
            transition: transform .15s ease, box-shadow .15s ease;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
        }

        .btn-back:hover {
            transform: translateY(-2px) translateZ(25px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45);
        }
    </style>
</head>

<body>

    <div id="video-bg-container">
        <video id="light-video"
            src="/videos/light-bg.mp4"
            autoplay loop muted playsinline></video>
        <video id="dark-video" src="/videos/dark-bg.mp4"
            autoplay loop muted playsinline></video>
        <div class="video-overlay"></div>
    </div>

    <div class="top-bar">
        <button type="button" class="ctrl-btn" id="themeToggle" title="Toggle Theme">
            <i class="fa-solid fa-moon dark-icon hidden dark:block"></i>
            <i class="fa-solid fa-sun light-icon block dark:hidden"></i>
        </button>
        <button type="button" class="ctrl-btn" id="langToggle">
            <span class="en">عربي 🌐</span>
            <span class="ar">English 🌐</span>
        </button>
    </div>

    <div class="card-wrap">
        <div class="scan-card">

            <div class="engraved-icon-box">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <h1 class="error-title">
                <span th:if="${errorTitle == null}">
                    <span class="en">Something went wrong</span>
                    <span class="ar">حدث خطأ ما</span>
                </span>
                <span th:if="${errorTitle != null}" th:text="${errorTitle}"></span>
            </h1>

            <p class="error-msg">
                <span th:if="${errorMessage == null}">
                    <span class="en">An unexpected error occurred. Our team has been notified.</span>
                    <span class="ar">حدث خطأ غير متوقع. تم إبلاغ فريق الدعم الفني بالمشكلة.</span>
                </span>
                <span th:if="${errorMessage != null}" th:text="${errorMessage}"></span>
            </p>

            <a href="/" class="btn-back">
                <i class="fa-solid fa-arrow-left ltr:mr-1 rtl:rotate-180 rtl:ml-1"></i>
                <span class="en">Back to Dashboard</span>
                <span class="ar">العودة للرئيسية</span>
            </a>

        </div>
    </div>

    <script>
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        const langBtn = document.getElementById('langToggle');

        // ─── تبديل الدارك مود ───
        themeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isDark = html.classList.toggle('dark');
            document.querySelector('.dark-icon').classList.toggle('hidden', !isDark);
            document.querySelector('.dark-icon').classList.toggle('block', isDark);
            document.querySelector('.light-icon').classList.toggle('hidden', isDark);
            document.querySelector('.light-icon').classList.toggle('block', !isDark);
        });

        // ─── تبديل اللغة ───
        langBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const currentLang = html.getAttribute('lang') || 'en';
            const isNowAr = currentLang === 'en';
            html.setAttribute('lang', isNowAr ? 'ar' : 'en');
            html.setAttribute('dir', isNowAr ? 'rtl' : 'ltr');
        });

        // ─── GSAP 3D IN-PLACE FLOAT ───
        const card = document.querySelector('.scan-card');
        if (card) {
            card.floatTween = gsap.fromTo(card,
                { y: 0 },
                { y: -8, duration: gsap.utils.random(2, 3), yoyo: true, repeat: -1, ease: "sine.inOut" }
            );

            card.addEventListener('mousemove', (e) => {
                card.floatTween.pause();
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;

                gsap.to(card, {
                    rotationX: -y / 20,
                    rotationY: x / 20,
                    z: 20,
                    scale: 1.02,
                    boxShadow: "0 25px 50px rgba(0,0,0,0.5)",
                    borderColor: "rgba(239, 68, 68, 0.6)", /* توهج أحمر خفيف عند الوقوف عليه */
                    duration: 0.3,
                    ease: "power1.out"
                });
            });

            card.addEventListener('mouseleave', () => {
                gsap.to(card, {
                    rotationX: 0,
                    rotationY: 0,
                    z: 0,
                    scale: 1,
                    boxShadow: html.classList.contains('dark') ? "0 20px 60px rgba(0,0,0,0.5)" : "0 20px 60px rgba(0,0,0,0.12)",
                    borderColor: html.classList.contains('dark') ? "rgba(239, 68, 68, 0.2)" : "rgba(239, 68, 68, 0.3)",
                    duration: 0.5,
                    ease: "power2.out",
                    onComplete: () => {
                        gsap.fromTo(card, { y: 0 }, { y: -8, duration: gsap.utils.random(2, 3), yoyo: true, repeat: -1, ease: "sine.inOut" });
                    }
                });
            });
        }
    </script>
</body>

</html>
