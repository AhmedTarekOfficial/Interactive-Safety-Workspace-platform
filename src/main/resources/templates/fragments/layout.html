<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:attr="data-theme=${theme}, dir=${lang == 'ar' ? 'rtl' : 'ltr'}"
      lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${lang == 'ar'} ? 'سيف جارد - مدير السلامة' : 'SafeGuard — Safety Manager'">SafeGuard</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>



<!-- Toast (server flash) -->
<div id="toast-container" class="toast-container"></div>
<div id="server-toast-msg" th:if="${toast != null}" th:attr="data-msg=${toast}" style="display:none"></div>

<div class="app-shell">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <a href="/index" class="brand-logo">
                <div class="brand-icon">🛡</div>
                <div>
                    <div class="brand-name" th:text="${lang == 'ar'} ? 'سيف جارد' : 'SafeGuard'">SafeGuard</div>
                    <div class="brand-tagline" th:text="${lang == 'ar'} ? 'منصة السلامة المهنية' : 'Workplace Safety Platform'">Safety Platform</div>
                </div>
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-label" th:text="${lang == 'ar'} ? 'القائمة' : 'Menu'">Menu</div>

            <a th:href="@{/(lang=${lang},theme=${theme})}" class="nav-link active">
                <span class="nav-icon">📊</span>
                <span th:text="${lang == 'ar'} ? 'لوحة التحكم' : 'Dashboard'">Dashboard</span>
            </a>
            <a href="/employees" class="nav-link">
                <span class="nav-icon">👷</span>
                <span th:text="${lang == 'ar'} ? 'الموظفون' : 'Employees'">Employees</span>
            </a>
            <a href="/courses" class="nav-link">
                <span class="nav-icon">📚</span>
                <span th:text="${lang == 'ar'} ? 'الدورات' : 'Courses'">Courses</span>
            </a>
            <a href="/games" class="nav-link">
                <span class="nav-icon">🎮</span>
                <span th:text="${lang == 'ar'} ? 'الألعاب' : 'Games'">Games</span>
            </a>
            <a href="/reports" class="nav-link">
                <span class="nav-icon">📈</span>
                <span th:text="${lang == 'ar'} ? 'التقارير' : 'Reports'">Reports</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="nav-label" th:text="${lang == 'ar'} ? 'الإعدادات' : 'Settings'">Settings</div>
            <a href="/profile" class="nav-link">
                <span class="nav-icon">⚙</span>
                <span th:text="${lang == 'ar'} ? 'الإعدادات' : 'Settings'">Settings</span>
            </a>
        </div>
    </aside>

    <!-- ═══ MAIN ═══ -->
    <div class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="topbar-title" th:text="${lang == 'ar'} ? 'لوحة إدارة السلامة' : 'Safety Manager Dashboard'">Dashboard</div>
                <div class="topbar-subtitle" th:text="${lang == 'ar'} ? 'مراقبة تقدم الموظفين في برامج السلامة' : 'Monitor employee progress across safety training programs'">Monitor employees</div>
            </div>
            <div class="topbar-actions">
                <button id="theme-btn" class="toggle-btn" onclick="toggleTheme()">🌙 Dark</button>
                <button class="toggle-btn" onclick="toggleLang()"
                        th:text="${lang == 'ar'} ? 'English' : 'العربية'">العربية</button>
            </div>
        </header>

        <!-- Page Content Slot -->
        <div class="page-body" th:insert="~{::pageContent}">
        </div>

    </div>
</div>

<!-- ═══ MODALS ═══ -->

<!-- Detail Modal -->
<div id="detail-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:640px">
        <div class="modal-header">
            <span class="modal-title" th:text="${lang == 'ar'} ? 'تفاصيل الموظف' : 'Employee Details'">Employee Details</span>
            <button class="btn-icon" onclick="Modal.close('detail-modal')">✕</button>
        </div>
        <div class="modal-body" style="padding:0">
            <iframe id="detail-frame" style="width:100%;min-height:480px;border:none;border-radius:0 0 20px 20px" title="Employee Detail"></iframe>
        </div>
    </div>
</div>

<!-- Drop Course Confirm Modal -->
<div id="drop-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:420px">
        <div class="modal-header">
            <span class="modal-title" th:text="${lang == 'ar'} ? 'تأكيد الإلغاء' : 'Confirm Drop'">Confirm Drop</span>
            <button class="btn-icon" onclick="Modal.close('drop-modal')">✕</button>
        </div>
        <div class="modal-body">
            <p style="color:var(--text-secondary);margin-bottom:8px"
               th:text="${lang == 'ar'} ? 'هل تريد إلغاء تسجيل الموظف من:' : 'Drop employee from course:'">Drop employee from course:</p>
            <p id="drop-course-name" style="font-weight:700;color:var(--text-primary);font-size:15px"></p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="Modal.close('drop-modal')"
                    th:text="${lang == 'ar'} ? 'إلغاء' : 'Cancel'">Cancel</button>
            <form id="drop-form" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf != null} ? '_csrf' : '_x'" th:value="${_csrf != null} ? ${_csrf.token} : ''" />
                <button type="submit" class="btn btn-danger"
                        th:text="${lang == 'ar'} ? 'تأكيد الإلغاء' : 'Drop Course'">Drop Course</button>
            </form>
        </div>
    </div>
</div>

<!-- Reset Progress Confirm Modal -->
<div id="reset-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:420px">
        <div class="modal-header">
            <span class="modal-title" th:text="${lang == 'ar'} ? 'إعادة تعيين التقدم' : 'Reset Progress'">Reset Progress</span>
            <button class="btn-icon" onclick="Modal.close('reset-modal')">✕</button>
        </div>
        <div class="modal-body">
            <p style="color:var(--text-secondary)"
               th:text="${lang == 'ar'} ? 'إعادة تعيين جميع تقدم:' : 'Reset all progress for:'">Reset all progress for:</p>
            <p id="reset-emp-name" style="font-weight:700;color:var(--accent-red);font-size:15px;margin-top:6px"></p>
            <p style="font-size:12px;color:var(--text-muted);margin-top:8px"
               th:text="${lang == 'ar'} ? 'لا يمكن التراجع عن هذا الإجراء.' : 'This action cannot be undone.'">This cannot be undone.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="Modal.close('reset-modal')"
                    th:text="${lang == 'ar'} ? 'إلغاء' : 'Cancel'">Cancel</button>
            <form id="reset-form" method="post" style="display:inline">
                <button type="submit" class="btn btn-danger"
                        th:text="${lang == 'ar'} ? 'إعادة التعيين' : 'Reset'">Reset</button>
            </form>
        </div>
    </div>
</div>

<!-- Update Deadline Modal -->
<div id="deadline-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:400px">
        <div class="modal-header">
            <span class="modal-title" th:text="${lang == 'ar'} ? 'تحديث الموعد النهائي' : 'Update Deadline'">Update Deadline</span>
            <button class="btn-icon" onclick="Modal.close('deadline-modal')">✕</button>
        </div>
        <form id="deadline-form" method="post">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="deadline-input"
                           th:text="${lang == 'ar'} ? 'الموعد النهائي الجديد' : 'New Deadline'">New Deadline</label>
                    <input type="date" id="deadline-input" name="deadline" class="form-control" required/>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="Modal.close('deadline-modal')"
                        th:text="${lang == 'ar'} ? 'إلغاء' : 'Cancel'">Cancel</button>
                <button type="submit" class="btn btn-primary"
                        th:text="${lang == 'ar'} ? 'حفظ' : 'Save'">Save</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
