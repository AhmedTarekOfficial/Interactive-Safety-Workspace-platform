<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="topbar">
    <meta id="sh-role" th:content="${rulePosition}" content=""/>

    <div class="topbar-left">
        <div class="topbar-title" th:text="${lang=='ar'}?'لوحة السلامة المهنية':'Workplace Safety Dashboard'"></div>
        <div class="topbar-sub" th:text="${lang=='ar'}?'تتبع تقدم الموظفين في الدورات والألعاب التدريبية':'Track employee progress across safety courses and training games'"></div>
    </div>
    <div class="topbar-actions">
        <button id="theme-btn" class="toggle-btn" onclick="toggleTheme()"
                th:text="${theme=='dark'}?'☀ Light':'🌙 Dark'"></button>
        <button class="toggle-btn" onclick="toggleLang()"
                th:text="${lang=='ar'}?'English 🌐':'العربية 🌐'"></button>
        <div class="dd" id="profile-dd">
            <button type="button" class="dd-toggle" onclick="ProfileMenu.toggle(event)" th:title="${lang=='ar'}?'الملف الشخصي':'Profile'">
                <span th:text="${profileInitials != null ? profileInitials : 'U'}">U</span>
            </button>
            <div class="dd-menu" role="menu" aria-label="Profile menu">
                <a class="dd-item" th:href="@{/profile(lang=${lang},theme=${theme})}">
                    👤 <span th:text="${lang=='ar'}?'ملفي الشخصي':'My profile'"></span>
                </a>
                <div class="dd-sep"></div>
                <a class="dd-item" th:href="@{/logout}">
                    🚪 <span th:text="${lang=='ar'}?'تسجيل الخروج':'Logout'"></span>
                </a>
            </div>
        </div>
    </div>
</header>

<script>
  // Minimal dropdown controller (no dependencies)
  window.ProfileMenu = window.ProfileMenu || {
    toggle: function(ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      ev.stopPropagation();
      const dd = document.getElementById('profile-dd');
      if (!dd) return;
      dd.classList.toggle('open');
    }
  };
  document.addEventListener('click', function() {
    const dd = document.getElementById('profile-dd');
    if (dd) dd.classList.remove('open');
  });
</script>
</body>
</html>
